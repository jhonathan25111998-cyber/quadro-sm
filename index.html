<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação das Reuniões – Daisy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="app">
        <div class="header-title" id="headerTitulo">
            <h1>PROGRAMAÇÃO DAS REUNIÕES</h1>
            <h2 id="semanaData">CARREGUE O ARQUIVO XML</h2>
        </div>

        <!-- Área de upload -->
        <div class="upload-area" id="uploadArea">
            <p>Selecione o arquivo <strong>.xml</strong> da semana (formato DAISY).</p>
            <label for="fileInput">Escolher arquivo</label>
            <input type="file" id="fileInput" accept=".xml">
        </div>

        <!-- Modo edição -->
        <div id="editMode" style="display:none;">
            <div class="colunas-form">
                <div style="flex:65">
                    <div class="form-item"><label>Data:</label><input type="text" id="dataInput" readonly></div>
                    <div class="form-item"><label>Horário:</label><input type="text" id="horario" value="19:30 hs"></div>
                    <div class="form-item" data-categoria="PRESIDÊNCIA"><label>Presidente:</label><input type="text" id="presidente" placeholder="Presidente"></div>
                    <div class="form-item" data-categoria="ORAÇÕES"><label>Oração Inicial:</label><input type="text" id="oracaoInicial" placeholder="Oração Inicial"></div>
                    <div id="tesourosForm"></div>
                    <div id="ministerioForm"></div>
                    <div id="vidaForm"></div>
                    <div class="form-item" data-categoria="LEITOR"><label>Leitor:</label><input type="text" id="leitor" placeholder="Leitor"></div>
                    <div class="form-item"><label>Cântico Final Nº:</label><input type="number" id="cantoFinalNum"></div>
                    <div class="form-item" data-categoria="ORAÇÕES"><label>Oração Final:</label><input type="text" id="oracaoFinal" placeholder="Oração Final"></div>
                </div>
                <div style="flex:35">
                    <h3>MECÂNICAS</h3>
                    <div class="form-item" data-categoria="Indicador Entrada"><label>Ind. Entrada:</label><input type="text" id="indEntrada" placeholder="Ind. Entrada"></div>
                    <div class="form-item" data-categoria="Indicador Auditório"><label>Ind. Auditório:</label><input type="text" id="indAuditorio" placeholder="Ind. Auditório"></div>
                    <div class="form-item" data-categoria="Indicador Zoom"><label>Ind. Zoom:</label><input type="text" id="indZoom" placeholder="Ind. Zoom"></div>
                    <div class="form-item" data-categoria="Mídia"><label>Mídias:</label><input type="text" id="midias" placeholder="Mídias"></div>
                    <div class="form-item" data-categoria="Mídia"><label>Áudio:</label><input type="text" id="audio" placeholder="Áudio"></div>
                    <div class="form-item" data-categoria="Microfone"><label>Mic 1:</label><input type="text" id="mic1" placeholder="Microfone 1"></div>
                    <div class="form-item" data-categoria="Microfone"><label>Mic 2:</label><input type="text" id="mic2" placeholder="Microfone 2"></div>
                    <div class="form-item" data-categoria="Palco"><label>Palco:</label><input type="text" id="palco" placeholder="Palco"></div>
                    <h3>CITAÇÃO</h3>
                    <textarea id="citacao" style="width:100%; height:40px;"></textarea>
                    <h3>IMAGEM RODAPÉ</h3>
                    <input type="text" id="urlImagem" style="width:100%;" placeholder="https://...">
                </div>
            </div>
            <button class="btn-generate" onclick="gerarVisualizacao()">✅ GERAR PROGRAMAÇÃO</button>
        </div>

        <!-- Modo final (impressão) -->
        <div id="finalMode" style="display:none;">
            <div id="layoutFinal"></div>
            <button class="btn-generate" onclick="window.print()" style="background:#2c6e49;">🖨️ Imprimir / Salvar PDF</button>
            <button class="btn-generate" onclick="voltarEdicao()" style="background:#555;">↩️ Voltar e editar</button>
        </div>
    </div>

    <!-- Carregar scripts -->
    <script src="canticos.js"></script>
    <script src="script.js"></script>
</body>
</html>
